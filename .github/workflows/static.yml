name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: babylon-clay-scene/package-lock.json

      - uses: actions/configure-pages@v5

      - run: npm ci
        working-directory: babylon-clay-scene

      - run: npm run build
        working-directory: babylon-clay-scene

      - uses: actions/upload-pages-artifact@v3
        with:
          path: babylon-clay-scene/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
